# Render free web service. Deploy link: https://render.com/deploy?repo=https://github.com/vrevanthvarma/oauth-guide-navigator
services:
  - type: web
    name: approval-navigator
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DAILY_LIMIT
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
